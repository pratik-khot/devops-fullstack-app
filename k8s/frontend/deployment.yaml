apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: employee-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/pratik-khot/emp-app-frontend:c7e26398a1d3ee078f70b66eb14fbafaecd73e91
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
