
name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/pratik-khot/emp-app-frontend

jobs:
  frontend-ci:
    name: Frontend Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build React application
      - name: Build React application
        working-directory: frontend
        run: npm run build

      # 5. Configure Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build frontend Docker image
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          build-args: |
            REACT_APP_SERVER_URL=${{ vars.REACT_APP_SERVER_URL }}
          tags: emp-app-frontend:${{ github.sha }}

      # 7. Scan Docker image
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: emp-app-frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # 8. Authenticate with GHCR
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Push image to GHCR
      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker tag emp-app-frontend:${{ github.sha }} ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
